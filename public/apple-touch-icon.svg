<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c5f2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e4620;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners for iOS -->
  <rect width="180" height="180" rx="40" fill="url(#appleGrad)"/>
  
  <!-- Tools icon - scaled up -->
  <g fill="#ffffff" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wrench -->
    <path d="M 50 120 L 70 100 L 110 140 L 90 160 Z" fill="#d97706"/>
    <circle cx="74" cy="96" r="14" fill="none" stroke-width="5"/>
    <path d="M 60 90 L 45 75 L 55 65 L 70 80" stroke-width="5"/>
    
    <!-- Hammer -->
    <rect x="100" y="50" width="12" height="50" fill="#d97706" transform="rotate(45 106 75)"/>
    <rect x="115" y="35" width="25" height="12" fill="#d97706" transform="rotate(45 127.5 41)"/>
  </g>
  
  <!-- Brand text -->
  <text x="90" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">tak trzeba</text>
</svg>
