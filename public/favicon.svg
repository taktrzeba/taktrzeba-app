<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c5f2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e4620;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad)"/>
  
  <!-- Wrench icon -->
  <g fill="#ffffff" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wrench body -->
    <path d="M 30 65 L 40 55 L 60 75 L 50 85 Z" fill="#d97706"/>
    <!-- Wrench head -->
    <circle cx="42" cy="53" r="8" fill="none" stroke-width="3"/>
    <path d="M 35 50 L 28 43 L 32 39 L 39 46" stroke-width="3"/>
    
    <!-- Hammer -->
    <rect x="55" y="30" width="8" height="30" fill="#d97706" transform="rotate(45 59 45)"/>
    <rect x="62" y="23" width="15" height="8" fill="#d97706" transform="rotate(45 69.5 27)"/>
  </g>
</svg>
